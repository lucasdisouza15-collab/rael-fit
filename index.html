<title>Frangômetro</title>

<style>
/* Layout: app de uma coluna, mobile-first, barra de abas fixa embaixo, folhas (sheets) sobem de baixo */
:root{
  --bg:#F3F4F6; --surface:#ffffff; --surface-2:#E9EBF0; --ink:#1B1630; --ink-2:#4A4660; --muted:#5A5E6B;
  --line:#D5D8DF; --accent:#2F4C9E; --accent-ink:#ffffff; --accent-soft:#E7ECF7;
  --prot:#2F4C9E; --carb:#F2C14E; --gord:#D4574A; --fib:#8A86A0;
  --good:#2B7A57; --warn:#8A5A00; --bad:#C0392B; --deficit:#2F4C9E; --surplus:#D4574A;
  --grid:#E4E6EB; --axis:#C9CCD6;
  --shadow:none;
  --f-display:"Fredoka",ui-sans-serif,system-ui,sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.datenav{margin-left:auto;display:flex;align-items:center;gap:2px}
.datenav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink-2);font-size:18px}
.datenav button:hover{background:var(--surface-2)}
.datenav .lbl{font-weight:600;font-size:14px;min-width:64px;text-align:center;cursor:pointer;padding:6px 4px;border-radius:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap-ok{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 2px 0}
.sec-title h2{font-size:16px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .small{font-size:13px} .xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:42px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted)}
.li.tap{cursor:pointer;border-radius:8px}
.li.tap:hover{background:var(--surface-2)}
.kcal-r{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.macro{display:flex;flex-direction:column;gap:5px;min-width:0}
.macro .v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:12px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:11.5px;color:var(--muted);margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.kv b{font-variant-numeric:tabular-nums;font-weight:600}
.balance{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;text-align:center;gap:4px}
.balance .op{color:var(--muted);font-family:var(--f-display);font-size:18px}
.balance .n{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.balance .l{font-size:11.5px;color:var(--muted)}
.water{display:flex;gap:5px;flex-wrap:wrap}
.cup{width:26px;height:32px;border-radius:4px 4px 8px 8px;border:2px solid var(--accent);opacity:.35;cursor:pointer;background:transparent;padding:0}
.cup.on{background:var(--accent);opacity:1}
.meal-h{display:flex;align-items:center;gap:8px}
.meal-h h3{flex:1}
.ex-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:center;padding:4px 2px}
.sets td{padding:3px 2px;text-align:center}
.sets input{text-align:center;min-height:36px;padding:5px 4px;border-radius:8px}
.sets tr.done td{background:color-mix(in srgb,var(--good) 10%,transparent)}
.sets tr.done td:first-child{border-radius:8px 0 0 8px}.sets tr.done td:last-child{border-radius:0 8px 8px 0}
.check{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:18px;height:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{border:1px solid var(--line);border-radius:11px;padding:7px 3px;text-align:center;background:var(--surface);cursor:pointer;min-width:0}
.wd .d{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.wd .r{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.rest .r{color:var(--muted)}
.wd.done{background:var(--accent-soft)}
/* folhas */
.scrim{position:fixed;inset:0;background:rgba(6,10,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.sheet.anim{animation:up .22s ease-out}
.sheet.full{height:100%;max-height:100%;border-radius:0}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.anim{animation:none}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet.full .sheet-h{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet-h h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b>*{flex-shrink:0}
.sheet-b{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;flex:1}
.sheet-f{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface)}
.toast{z-index:60;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.restbar b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.restbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.ai{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.ai-out{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{padding:9px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;font-size:14.5px}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tip{position:fixed;z-index:70;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);line-height:1.5}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.hidden{display:none!important}
details.acc summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
.confirm{background:color-mix(in srgb,var(--bad) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

.pill.good{background:var(--accent-soft);color:#2F4C9E}
.pill.warn{background:#FBEFC9;color:#7A5A00}
.pill.bad{background:#F6DAD6;color:#A23327}
.sets tr.done td{background:var(--accent-soft)}
.check.on{background:#2F4C9E;border-color:#2F4C9E}
.card{border-width:1.5px}
/* Frangômetro: Rael e medidor (só o mascote e o medidor levam cor da marca) */
.brand{min-width:0;white-space:nowrap}.brand .fr-logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand .fr-ver{white-space:nowrap;font-size:10px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px}
.fr-top{display:flex;align-items:center;gap:12px}
.fr-bal{min-width:0;flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.fr-fala{font-size:13.5px;font-style:italic;color:var(--ink-2);line-height:1.4}
.fr-card{text-align:left}
.fr-nivel{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:22px;border-radius:999px;padding:2px 16px}
.fr-pintinho{background:#F2C14E;color:#1B1630}.fr-frango{background:#2F4C9E;color:#fff}.fr-galo{background:#D4574A;color:#fff}
.fr-kcal{text-align:center;margin-top:8px;font-size:15px}.fr-kcal b{font-family:var(--f-display);font-size:26px;font-weight:600}
.fr-seq{font-family:var(--f-display);font-weight:600;font-size:30px;min-width:1.6em;text-align:center}
@media (max-width:460px){.brand .fr-ver{display:none}}
/* Rael Frango animado: cenas por hora do dia e por treino (só CSS; respeita "reduzir movimento") */
.ra{display:inline-block;line-height:0;position:relative}
.ra svg{overflow:visible}
.ra .ra-corpo{transform-origin:100px 180px}
.ra-resp .ra-corpo{animation:raResp 3.4s ease-in-out infinite}
@keyframes raResp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
.ra-pulo .ra-corpo{animation:raPulo .9s ease-in-out infinite}
@keyframes raPulo{0%,100%{transform:translateY(0) scale(1.04,.94)}45%{transform:translateY(-22px) scale(.97,1.05)}}
.ra-bal .ra-corpo{animation:raBal 3.6s ease-in-out infinite}
@keyframes raBal{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.ra-cansa .ra-corpo{animation:raCansa 4s ease-in-out infinite;transform-origin:100px 180px}
@keyframes raCansa{0%,100%{transform:rotate(-5deg) scale(1,.98)}50%{transform:rotate(-7deg) scale(1.01,1.0)}}
.ra .ra-xic{animation:raXic 4.2s ease-in-out infinite;transform-origin:162px 150px}
@keyframes raXic{0%,55%,100%{transform:rotate(0)}70%,85%{transform:rotate(-24deg) translateY(-6px)}}
.ra .ra-vap{animation:raVap 2.4s ease-in infinite;opacity:0}
.ra .ra-vap:nth-of-type(2){animation-delay:.8s}
@keyframes raVap{0%{opacity:0;transform:translateY(8px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.ra .ra-lid{animation:raLid 5s ease-in-out infinite;transform-origin:50% 0;transform-box:fill-box}
@keyframes raLid{0%{transform:scaleY(1)}30%,70%{transform:scaleY(.45)}80%,100%{transform:scaleY(.2)}}
.ra .ra-z{animation:raZ 3.2s ease-out infinite;opacity:0;font:800 22px Fredoka,system-ui,sans-serif;fill:#2F4C9E}
.ra .ra-z:nth-of-type(2){animation-delay:1.1s}.ra .ra-z:nth-of-type(3){animation-delay:2.2s}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const fmt = n => r0(n).toLocaleString("pt-BR");
const fmt1 = n => r1(n).toLocaleString("pt-BR");
const num = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : 0; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
const TODAY = () => iso(new Date());
function addDays(s, n) { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); }
const dowOf = s => new Date(s + "T12:00:00").getDay();
const DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DOWL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const ddmm = s => s.slice(8, 10) + "/" + s.slice(5, 7);
function labelDate(s) {
  const t = TODAY();
  if (s === t) return "Hoje";
  if (s === addDays(t, -1)) return "Ontem";
  if (s === addDays(t, 1)) return "Amanhã";
  return DOW[dowOf(s)] + " " + ddmm(s);
}
function mmss(sec) { sec = Math.max(0, r0(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function hhmm(sec) { sec = Math.max(0, r0(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? h + "h" + String(m).padStart(2, "0") : m + " min"; }

async function connectCloud() {

const BASE_FOODS = FOOD_BASE.map((a, i) => ({ key: "b" + i, nome: a[0], kcal: a[1], p: a[2], c: a[3], g: a[4], f: a[5], cat: a[6], src: a[7], un: a[8] || null, unNome: a[9] || null, tipo: "100g" }));

  const rec = (p.receitas || []).map(r => { const t = recipePer(r); return { key: "r" + r.id, nome: r.nome, kcal: t.kcal, p: t.p, c: t.c, g: t.g, f: t.f, cat: "Receitas", src: "R", tipo: "porcao", rid: r.id }; });

function dayT(d) { return sumT(MEALS.map(([m]) => mealT(d, m))); }

}

// ---------- metas e gasto ----------
const ATIV = [[1.2,"Sedentário (pouco ou nenhum movimento)"],[1.375,"Leve (em pé parte do dia, anda um pouco)"],[1.55,"Moderado (trabalho ativo, anda bastante)"],[1.725,"Alto (trabalho braçal)"],[1.9,"Muito alto (braçal pesado + muito movimento)"]];
function pesoAtual(p = P()) { const ds = allDays(); for (let i = ds.length - 1; i >= 0; i--) { const d = getDoc("dia-" + ds[i]); if (d && d.peso) return d.peso; } return num(p.peso) || 70; }
function pesoNa(date, p = P()) { const ds = allDays().filter(x => x <= date); for (let i = ds.length - 1; i >= 0; i--) { const d = getDoc("dia-" + ds[i]); if (d && d.peso) return d.peso; } return num(p.peso) || 70; }

function metasCalc(p = P()) {
  const w = pesoAtual(p), gb = gastoBase(p, w);
  let kcal = p.objetivo === "perder" ? gb - num(p.ajuste) : p.objetivo === "ganhar" ? gb + num(p.ajuste) : gb;
  const piso = p.sexo === "F" ? 1200 : 1500; let baixo = false;
  if (kcal < piso) { kcal = piso; baixo = true; }
  const gkg = { perder: 2.0, manter: 1.6, ganhar: 1.8 }[p.objetivo] || 1.6;
  const prot = gkg * w, gord = 0.8 * w, carb = Math.max(0, (kcal - prot * 4 - gord * 9) / 4);
  return { kcal: r0(kcal), p: r0(prot), c: r0(carb), g: r0(gord), f: r0(kcal / 1000 * 14), agua: Math.round(w * 35 / 50) * 50, baixo };

}
function metaDoDia(date, p = P()) { const m = metas(p); if (!p.somarTreino) return m.kcal; const g = gastoDia(date, p); return m.kcal + g.atv + g.tr; }

const EX_BY = {};
EX_BASE.forEach(e => { EX_BY[e[0]] = { id: e[0], nome: e[1], grupo: e[2], equip: e[3], tipo: e[4] }; });

function exById(id, p) { return (p ? allEx(p) : allEx()).find(e => e.id === id) || EX_BY[id] || { id, nome: "Exercício removido", grupo: "", equip: "", tipo: "carga" }; }

}
const e1rm = (kg, reps) => kg > 0 && reps > 0 ? kg * (1 + reps / 30) : 0;
function lastPerf(eid, beforeTs) {
  for (const w of workouts()) { if (beforeTs && w.inicio >= beforeTs) continue; const ex = (w.ex || []).find(x => x.eid === eid); if (ex && ex.series.some(s => s.ok)) return { w, ex }; }
  return null;
}
function bestOf(eid) {
  let best = 0, bestKg = 0, date = null;
  for (const w of workouts()) { const ex = (w.ex || []).find(x => x.eid === eid); if (!ex) continue; ex.series.forEach(s => { if (!s.ok) return; const v = e1rm(num(s.kg), num(s.reps)); if (v > best) { best = v; bestKg = num(s.kg); date = w.data; } }); }

// progressão: bateu o topo das repetições em todas as séries válidas -> +incremento; senão mantém a carga e busca +1 repetição
function suggest(eid, item, p = P()) {
  const lp = lastPerf(eid); if (!lp) return null;
  const ok = lp.ex.series.filter(s => s.ok && s.tipo !== "aq");
  if (!ok.length) return null;
  const kg = Math.max(...ok.map(s => num(s.kg)));
  const top = num(item && item.max) || 12, min = num(item && item.min) || 8;
  const atKg = ok.filter(s => num(s.kg) === kg);
  const hitTop = atKg.length >= Math.min(ok.length, num(item && item.series) || ok.length) && atKg.every(s => num(s.reps) >= top);
  if (hitTop && kg > 0) return { kg: r1(kg + num(p.incremento || 2)), reps: min, up: true, last: lp };
  const reps = Math.min(top, Math.max(...atKg.map(s => num(s.reps))) + 1);
  return { kg, reps, up: false, last: lp };
}

function blobToB64(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); }); }
function apiSampler(key) {
  async function call(input, opts = {}) {
    let msgs = typeof input === "string" ? [{ role: "user", content: input }] : input.map(m => ({ role: m.role, content: m.content }));
    // a API não aceita duas mensagens seguidas do mesmo papel
    msgs = msgs.reduce((a, m) => { const l = a[a.length - 1]; if (l && l.role === m.role) l.content += "\n\n" + m.content; else a.push(Object.assign({}, m)); return a; }, []);
    const imgs = opts.images ? [].concat(opts.images) : [];
    if (imgs.length) {
      const last = msgs[msgs.length - 1], parts = [];
      for (const b of imgs) parts.push({ type: "image", source: { type: "base64", media_type: b.type && /^image\/(jpeg|png|gif|webp)$/.test(b.type) ? b.type : "image/jpeg", data: await blobToB64(b) } });
      parts.push({ type: "text", text: last.content }); last.content = parts;
    }
    const body = { model: "claude-opus-5-5", max_tokens: 16000, output_config: { effort: opts.effort || "low" }, fallbacks: "default", messages: msgs };
    const headers = { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2026-10-21", "anthropic-beta": "server-side-fallback-2026-07-01", "anthropic-dangerous-direct-browser-access": "true" };
    let r;
    try { r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify(body), signal: opts.signal }); }
    catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network", message: String(e) }; }
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      const msg = j && j.error && j.error.message || "";
      throw { code: r.status === 401 || r.status === 403 ? "bad_key" : r.status === 429 ? "rate_limited" : /credit|billing|balance/i.test(msg) ? "no_credit" : r.status >= 500 ? "upstream_error" : "invalid_request", message: msg };
    }
    if (j.stop_reason === "refusal") throw { code: "refused", message: "" };
    const text = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
    if (!text) throw { code: "empty_completion", message: "" };
    if (opts.onText) opts.onText({ text, delta: text });
    return { text, truncated: j.stop_reason === "max_tokens" };
  }
  const f = (input, opts) => call(input, opts);
  f.json = async (input, opts) => { const { text } = await call(input, opts); const v = parseLoose(text); if (v == null) throw { code: "invalid_json", message: "", text }; return v; };
  f.limits = async () => ({ images: { maxCount: 1 } });
  return f;
}

// ---------- IA grátis pelo Gemini (chave do Google AI Studio, guardada só neste aparelho) ----------
const GEM = "https://generativelanguage.googleapis.com/v1beta/";
const GEM_LS = "raelfit:gemmodels";
// descobre os modelos Flash disponíveis para a chave, do mais novo ao mais antigo
async function geminiModels(key, fresh) {
  if (!fresh) { try { const c = JSON.parse(localStorage.getItem(GEM_LS) || "null"); if (c && c.k === key.slice(-6) && c.list.length && Date.now() - c.t < 7 * 864e5) return c.list; } catch (e) {} }
  let r; try { r = await fetch(GEM + "models?pageSize=200&key=" + encodeURIComponent(key)); } catch (e) { throw { code: "network", message: String(e) }; }
  if (r.status === 400 || r.status === 401 || r.status === 403) throw { code: "bad_key", message: "" };
  if (!r.ok) throw { code: "upstream_error", message: "" };
  const j = await r.json();
  const ver = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const list = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""))
    .filter(n => /^gemini-[\d.]+-flash/.test(n) && !/image|tts|audio|live|thinking-exp|embedding|8b/.test(n))
    .filter(n => ver(n) >= 3 && !/preview|exp/.test(n))
    .sort((a, b) => (/lite/.test(a) - /lite/.test(b)) || ver(b) - ver(a) || a.length - b.length);
  // intercala: dois Flash completos, depois dois lite, para cair rápido num modelo livre
  const full = list.filter(n => !/lite/.test(n)), lite = list.filter(n => /lite/.test(n));
  list.length = 0; list.push(...full.slice(0, 2), ...lite.slice(0, 2), ...full.slice(2, 4), ...lite.slice(2, 3));
  // no plano grátis os modelos mais novos vivem lotados (erro 503): os "lite" e os apelidos entram como reserva
  ["gemini-flash-latest", "gemini-flash-lite-latest"].forEach(n => { if (!list.includes(n)) list.push(n); });
  try { localStorage.setItem(GEM_LS, JSON.stringify({ k: key.slice(-6), t: Date.now(), list })); } catch (e) {}
  return list;
}
function geminiSampler(key) {
  async function call(input, opts = {}, wantJson) {
    let msgs = typeof input === "string" ? [{ role: "user", content: input }] : input;
    const contents = msgs.reduce((a, m) => { const role = m.role === "assistant" ? "model" : "user"; const l = a[a.length - 1]; if (l && l.role === role) l.parts[0].text += "\n\n" + m.content; else a.push({ role, parts: [{ text: m.content }] }); return a; }, []);
    for (const b of (opts.images ? [].concat(opts.images) : [])) contents[contents.length - 1].parts.unshift({ inline_data: { mime_type: b.type && /^image\//.test(b.type) ? b.type : "image/jpeg", data: await blobToB64(b) } });
    const body = { contents, generationConfig: wantJson ? { responseMimeType: "application/json" } : {} };
    const models = await geminiModels(key);
    let last = null;
    for (const model of models.slice(0, 8)) {
      let r, j = null;
      // timeout por modelo: modelo lento ou lotado passa para o próximo
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 40000);
      const onAbort = () => ctl.abort(); if (opts.signal) opts.signal.addEventListener("abort", onAbort);
      const b = /^gemini-3/.test(model) && !opts.images ? Object.assign({}, body, { generationConfig: Object.assign({ thinkingConfig: { thinkingLevel: "low" } }, body.generationConfig) }) : body;
      try { r = await fetch(GEM + "models/" + model + ":generateContent?key=" + encodeURIComponent(key), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b), signal: ctl.signal }); try { j = await r.json(); } catch (e) {} }
      catch (e) { if (opts.signal && opts.signal.aborted) throw { code: "cancelled", message: "" }; last = { code: "network", message: String(e) }; continue; }
      finally { clearTimeout(tm); if (opts.signal) opts.signal.removeEventListener("abort", onAbort); }
      if (r.status === 400 && b !== body && /thinking/i.test(JSON.stringify(j || ""))) { try { r = await fetch(GEM + "models/" + model + ":generateContent?key=" + encodeURIComponent(key), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal: opts.signal }); j = null; try { j = await r.json(); } catch (e) {} } catch (e) { last = { code: "network", message: String(e) }; continue; } }
      if (r.status === 404 || r.status === 429 || r.status >= 500) { last = { code: r.status === 429 ? "rate_limited" : "upstream_error", message: "" }; if (r.status === 404) try { localStorage.removeItem(GEM_LS); } catch (e) {} continue; }
      if (!r.ok) { const msg = j && j.error && j.error.message || ""; throw { code: /API key|API_KEY|permission/i.test(msg) || r.status === 403 ? "bad_key" : "invalid_request", message: msg }; }
      if (j.promptFeedback && j.promptFeedback.blockReason) throw { code: "refused", message: "" };
      const c = (j.candidates || [])[0];
      const text = c && c.content && (c.content.parts || []).filter(x => x.text && !x.thought).map(x => x.text).join("") || "";
      if (!text) { last = { code: "empty_completion", message: "" }; continue; }
      if (opts.onText) opts.onText({ text, delta: text });
      return { text, truncated: c.finishReason === "MAX_TOKENS" };
    }
    throw last || { code: "upstream_error", message: "" };
  }
  const f = (input, opts) => call(input, opts, false);
  f.json = async (input, opts) => { const { text } = await call(input, opts, true); const v = parseLoose(text); if (v == null) throw { code: "invalid_json", message: "", text }; return v; };
  f.limits = async () => ({ images: { maxCount: 1 } });
  return f;
}

const macroTxt = t => `P ${fmt(t.p)} · C ${fmt(t.c)} · G ${fmt(t.g)}`;
const CAT_PORCAO = { Cereais: 120, Leguminosas: 140, Carnes: 120, Peixes: 120, Ovos: 50, Laticínios: 200, Frutas: 120, Verduras: 60, Tubérculos: 150, Gorduras: 10, Doces: 20, Bebidas: 250, Prontos: 150, "Pães": 50, Oleaginosas: 30, Suplementos: 30, Receitas: 1 };

function macroBars(t, m) {
  const rows = [["Proteína", t.p, m.p, "--prot"], ["Carboidrato", t.c, m.c, "--carb"], ["Gordura", t.g, m.g, "--gord"], ["Fibra", t.f, m.f, "--fib"]];
  return `<div class="grid4">${rows.map(([n, v, g, c]) => `<div class="macro"><div class="xs muted row" style="gap:5px"><span class="dot" style="background:var(${c})"></span>${n}</div>
    <div class="bar"><i style="width:${clamp(g ? v / g * 100 : 0, 0, 100)}%;background:var(${c})"></i></div>
    <div class="v">${fmt(v)}<span class="muted"> / ${fmt(g)} g</span></div></div>`).join("")}</div>`;
}

// ---------- sugestões (sem IA): cobre o macro mais distante da meta dentro das kcal que restam ----------
function sugestoes(t, m, meta) {
  const restK = meta - t.kcal; if (restK < 80) return null;
  const gaps = [["p", "proteína", m.p - t.p, 4], ["c", "carboidrato", m.c - t.c, 4], ["g", "gordura", m.g - t.g, 9]].filter(x => x[2] > 3);
  if (!gaps.length) return null;
  gaps.sort((a, b) => b[2] * b[3] / meta - a[2] * a[3] / meta);
  const [mk, mn, gap] = gaps[0];
  const cats = mk === "p" ? ["Carnes", "Peixes", "Ovos", "Laticínios", "Suplementos", "Leguminosas"] : mk === "c" ? ["Cereais", "Tubérculos", "Frutas", "Pães", "Leguminosas"] : ["Oleaginosas", "Gorduras", "Frutas"];
  const cands = allFoods().filter(f => f.tipo === "100g" && cats.includes(f.cat) && f.kcal > 0 && f[mk] > 0)
    .map(f => ({ f, dens: f[mk] * (mk === "g" ? 9 : 4) / f.kcal })).sort((a, b) => b.dens - a.dens);
  const out = [], seen = new Set();
  for (const { f } of cands) {
    if (seen.has(f.cat) && out.length < 6) continue;
    let g = gap / f[mk] * 100; g = Math.min(g, restK / f.kcal * 100, mk === "g" ? 40 : 300); g = Math.max(10, Math.round(g / 10) * 10);
    if (f.un) { const u = Math.max(1, Math.round(g / f.un)); g = u * f.un; }
    out.push({ f, g }); seen.add(f.cat);
    if (out.length >= 4) break;
  }
  return { mn, gap, restK, out };
}
function sugestoesCard(t, m, meta) {
  const s = sugestoes(t, m, meta);
  const ai = `<button class="btn sm soft" data-act="aiSuggest">${ICON.spark} Ideias com IA</button>`;
  if (!s) return ai ? `<div class="card ai"><div class="row between"><span class="ai-badge">${ICON.spark} Sugestões</span>${ai}</div></div>` : "";
  return `<div class="card"><div class="row between"><div><div class="eyebrow">Para fechar o dia</div><div class="small ink2">Faltam ${fmt(s.gap)} g de ${s.mn} e ${fmt(s.restK)} kcal.</div></div>${ai}</div>
    <div class="list" style="margin-top:6px">${s.out.map(({ f, g }) => { const k = g / 100; return `<div class="li"><div class="grow"><div class="t">${esc(f.nome)}</div><div class="s">${f.un ? fmt1(g / f.un) + " " + esc(f.unNome) + " · " : ""}${fmt(g)} g · ${fmt(f.kcal * k)} kcal · ${macroTxt({ p: f.p * k, c: f.c * k, g: f.g * k })}</div></div><button class="btn sm" data-act="addSug" data-key="${f.key}" data-g="${g}">Adicionar</button></div>`; }).join("")}</div></div>`;
}

const STOP = new Set(["de","do","da","dos","das","com","sem","e","a","o","as","os","um","uma","uns","umas","no","na","em","pra","para","tipo","bem","pouco","pouca"]);
const SYN = { macaxeira: "mandioca", aipim: "mandioca", refri: "refrigerante", coca: "refrigerante cola", guarana: "refrigerante", ovos: "ovo", frango: "frango peito", carne: "carne moida", bife: "patinho", pao: "pao frances", cafe: "cafe coado", suco: "suco laranja", whey: "whey", tapioca: "tapioca goma", cuscuz: "cuscuz milho", feijao: "feijao carioca", arroz: "arroz branco", batata: "batata inglesa", leite: "leite integral", iogurte: "iogurte natural", queijo: "queijo mucarela", azeite: "azeite", cerveja: "cerveja", acai: "acai", macarrao: "macarrao", peixe: "tilapia", mexido: "frito", mexidos: "frito" };

const MEDIDAS = [[/^(kg|quilo)s?$/, 1000], [/^(g|gr|grama)s?$/, 1], [/^ml$/, 1], [/^(l|litro)s?$/, 1000], [/^colher(es)?$/, 15], [/^concha(s)?$/, 140], [/^escumadeira(s)?$/, 90], [/^xicara(s)?$/, 160], [/^copo(s)?$/, 250], [/^prato(s)?$/, 300], [/^fatia(s)?$/, 25], [/^pedaco(s)?$/, 60], [/^lata(s)?$/, 350], [/^dose(s)?$/, 30], [/^scoop(s)?$/, 30], [/^pote(s)?$/, 170], [/^porcao|porcoes$/, null], [/^(unidade|un|und)s?$/, "un"], [/^(file|bife|posta)s?$/, 120], [/^punhado(s)?$/, 30]];

function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", 0.85);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

function adaptItens(itens, local, nivel, foco) {
  const ok = EQ_LOCAL[local], used = new Set(), out = [];
  for (const [eid, s, mn, mx, d] of itens) {
    let ex = EX_BY[eid];
    if (ok && !ok.includes(ex.equip)) {
      const alt = Object.values(EX_BY).find(x => x.grupo === ex.grupo && ok.includes(x.equip) && !used.has(x.id) && (x.tipo === ex.tipo || x.tipo === "corpo"));
      if (!alt) continue; ex = alt;
    }
    if (used.has(ex.id)) continue; used.add(ex.id);
    let series = s + (nivel === "ini" ? -1 : nivel === "ava" ? 1 : 0), min = mn, max = mx, desc = d;
    if (ex.tipo === "carga" && foco === "forca" && mx <= 12) { min = Math.max(3, mn - 3); max = Math.max(min + 2, mx - 4); desc = d + 30; }
    if (ex.tipo === "carga" && foco === "def") { min = mn + 2; max = mx + 3; desc = Math.max(45, d - 30); }
    out.push({ eid: ex.id, series: Math.max(2, series), min, max, desc });
  }
  return out;
}

// Escolha da cena do momento (substitui a anterior): gatilhos por hora, dia, treino, comida, água, peso, sequência e nota.
// Variações: em situações parecidas, o dia do mês escolhe entre 2 ou 3 cenas, para não ficar repetitivo.
let FR_ULT = { slot: -1, salt: 0, cena: "" };
const FR_SLOT_MS = 3600000; // a cena é reavaliada a cada 1 hora
function frCenaApp0(c, dia) {
  if (FR_REACAO && Date.now() < FR_REACAO.ate) return FR_REACAO.cena;
  const P = L => L[dia % L.length]; // escolhe dentro do grupo que combina com o momento
  const h = c.hr, dow = c.dow;
  if (c.pensando) return "pensando";
  if (c.ativo) return "treinando";
  if (c.correndo) return P(["fone", "corrida"]);
  // treinou hoje: comemoração. fogo só com sequência; água ok soma "hidratado"
  if (c.treinou) {
    const L = ["forte", "aplauso", "shake", "danca"];
    if ((c.seq || 0) >= 3) L.push("fogo");
    if (c.aguaOk) L.push("hidratado");
    if (h >= 21) return P(["forte", "aplauso", "noite", "meditando"]);
    return P(L);
  }
  if (c.passou) return P(["rei", "alfa"]);
  if (c.estourou) return "pizza";
  if (c.nivel === "Pintinho" && c.temComida && h >= 14 && h < 22 && dia % 3 === 0) return "pintinho";
  if (h < 5) return P(["geladeira", "bocejo", "soneca"]);
  if (h < 9) { const L = ["manha", "cafeina", "bocejo", "alongando"]; if (c.aguaOk) L.push("hidratado"); return P(L); }
  if (dow === 0 && h < 18) return P(["domingo", "meditando", "sofa", "soneca", "alongando"]);
  if (dow === 6 && h >= 11 && h < 18) return P(["sabado", "fone", "cafeina", "alongando"]);
  if (h < 11) return P(["manha", "cafeina", "alongando", "fone"]);
  if (h < 14) {
    if (c.temComida) return P(["almoco", "almoco", "hidratado", "alongando"].filter(x => x !== "hidratado" || c.aguaOk));
    return P(["relogio", "almoco", "geladeira"]);
  }
  if (h < 18) {
    const L = ["soneca", "cafeina", "alongando", "fone"];
    if (c.aguaOk) L.push("hidratado");
    if (!c.temComida) L.push("relogio");
    if (c.treinavel === false) L.push("alongando", "meditando");
    return P(L);
  }
  if (h < 22) {
    if (c.treinavel && !c.mexeu) return P(["sofa", "noite", "relogio"]);
    return P(["noite", "meditando", "fone", "sofa"]);
  }
  return P(["noite", "bocejo", "soneca", "meditando"]);
}
// nunca repete a cena anterior quando há outra opção (a corrida pós-exercício continua mandando)
function frCenaApp(c) {
  const slot = Math.floor(Date.now() / FR_SLOT_MS);
  if (FR_ULT.slot === slot) { const r = frCenaApp0(c, FR_ULT.salt); FR_ULT.cena = r; return r; }
  const ant = FR_ULT.cena; let salt = slot, r = frCenaApp0(c, salt);
  for (let k = 1; r === ant && k <= 6; k++) { salt = slot + k; r = frCenaApp0(c, salt); }
  FR_ULT = { slot, salt, cena: r }; return r;
}
setInterval(() => { try { const ae = document.activeElement; if ((ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) || SHEET.stack.length || FR_ULT.slot === Math.floor(Date.now() / FR_SLOT_MS)) return; render(); } catch (_) {} }, 60000);

function parseLoose(txt) {
  txt = String(txt || "").trim();
  try { return JSON.parse(txt); } catch (e) {}
  const f = txt.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = txt.indexOf("{"), b = txt.lastIndexOf("}"); if (a >= 0 && b > a) { try { return JSON.parse(txt.slice(a, b + 1)); } catch (e) {} }
  return null;
}
ACT.extUse = () => {

  const r = parseLoose(EXT.resp);
  if (!r) { EXT.err = "Não consegui ler. Cole a resposta inteira, do { até o }."; redrawSheet(); return; }
  const cb = EXT.onResult; closeSheet(); cb && cb(r); if (SHEET.stack.length) redrawSheet(false); else render();
};
