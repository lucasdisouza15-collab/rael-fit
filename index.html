const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const fmt = n => r0(n).toLocaleString("pt-BR");
const fmt1 = n => r1(n).toLocaleString("pt-BR");
const num = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : 0; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
const TODAY = () => iso(new Date());
function addDays(s, n) { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); }
const dowOf = s => new Date(s + "T12:00:00").getDay();
const DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DOWL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const ddmm = s => s.slice(8, 10) + "/" + s.slice(5, 7);
function labelDate(s) {
  const t = TODAY();
  if (s === t) return "Hoje";
  if (s === addDays(t, -1)) return "Ontem";
  if (s === addDays(t, 1)) return "Amanhã";
  return DOW[dowOf(s)] + " " + ddmm(s);
}
function mmss(sec) { sec = Math.max(0, r0(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function hhmm(sec) { sec = Math.max(0, r0(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? h + "h" + String(m).padStart(2, "0") : m + " min"; }

// descobre os modelos Flash disponíveis para a chave, do mais novo ao mais antigo
async function geminiModels(key, fresh) {

  let r; try { r = await fetch(GEM + "models?pageSize=200", { headers: { "x-goog-api-key": key } }); } catch (e) { throw { code: "network", message: String(e) }; }
  if (r.status === 400 || r.status === 401 || r.status === 403) throw { code: "bad_key", message: "" };
  if (!r.ok) throw { code: "upstream_error", message: "" };
  const j = await r.json();
  const ver = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const list = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""))
    .filter(n => /^gemini-[\d.]+-flash/.test(n) && !/image|tts|audio|live|thinking-exp|embedding|8b/.test(n))
    .filter(n => ver(n) >= 3 && !/preview|exp/.test(n))
    .sort((a, b) => (/lite/.test(a) - /lite/.test(b)) || ver(b) - ver(a) || a.length - b.length);

  const full = list.filter(n => !/lite/.test(n)), lite = list.filter(n => /lite/.test(n));

  ["gemini-flash-latest", "gemini-flash-lite-latest"].forEach(n => { if (!list.includes(n)) list.push(n); });
  try { localStorage.setItem(GEM_LS, JSON.stringify({ k: key.slice(-6), t: Date.now(), list })); } catch (e) {}
  return list;
}

// ---------- sugestões (sem IA): cobre o macro mais distante da meta dentro das kcal que restam ----------
function sugestoes(t, m, meta) {
  const restK = meta - t.kcal; if (restK < 80) return null;
  const gaps = [["p", "proteína", m.p - t.p, 4], ["c", "carboidrato", m.c - t.c, 4], ["g", "gordura", m.g - t.g, 9]].filter(x => x[2] > 3);
  if (!gaps.length) return null;
  gaps.sort((a, b) => b[2] * b[3] / meta - a[2] * a[3] / meta);
  const [mk, mn, gap] = gaps[0];
  const cats = mk === "p" ? ["Carnes", "Peixes", "Ovos", "Laticínios", "Suplementos", "Leguminosas"] : mk === "c" ? ["Cereais", "Tubérculos", "Frutas", "Pães", "Leguminosas"] : ["Oleaginosas", "Gorduras", "Frutas"];
  const cands = allFoods().filter(f => f.tipo === "100g" && cats.includes(f.cat) && f.kcal > 0 && f[mk] > 0)
    .map(f => ({ f, dens: f[mk] * (mk === "g" ? 9 : 4) / f.kcal })).sort((a, b) => b.dens - a.dens);
  const out = [], seen = new Set();
  for (const { f } of cands) {
    if (seen.has(f.cat) && out.length < 6) continue;
    let g = gap / f[mk] * 100; g = Math.min(g, restK / f.kcal * 100, mk === "g" ? 40 : 300); g = Math.max(10, Math.round(g / 10) * 10);
    if (f.un) { const u = Math.max(1, Math.round(g / f.un)); g = u * f.un; }
    out.push({ f, g }); seen.add(f.cat);
    if (out.length >= 4) break;
  }
  return { mn, gap, restK, out };
}
function sugestoesCard(t, m, meta) {
  const s = sugestoes(t, m, meta);
  const ai = `<button class="btn sm soft" data-act="aiSuggest">${ICON.spark} Ideias com IA</button>`;
  if (!s) return ai ? `<div class="card ai"><div class="row between"><span class="ai-badge">${ICON.spark} Sugestões</span>${ai}</div></div>` : "";
  return `<div class="card"><div class="row between"><div><div class="eyebrow">Para fechar o dia</div><div class="small ink2">Faltam ${fmt(s.gap)} g de ${s.mn} e ${fmt(s.restK)} kcal.</div></div>${ai}</div>

}

const STOP = new Set(["de","do","da","dos","das","com","sem","e","a","o","as","os","um","uma","uns","umas","no","na","em","pra","para","tipo","bem","pouco","pouca"]);

function foodTokens(f) { let t = FOOD_TOK.get(f.nome); if (!t) { t = tokens(f.nome); FOOD_TOK.set(f.nome, t); } return t; }

  let hit = 0; qt.forEach(w => { if (ft.some(x => x === w || (w.length >= 4 && x.startsWith(w)) || (x.length >= 4 && w.startsWith(x)))) hit++; });
  if (!hit) return 0;
  let s = hit / qt.length + 0.25 * (hit / ft.length);
  if (ft[0] === qt[0] || ft[0].startsWith(qt[0])) s += 0.3;
  if (f.src === "M" || f.src === "R") s += 0.05;
  return s;
}
const NUMW = { meia: 0.5, meio: 0.5, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10 };
// medidas caseiras em gramas (aproximadas, NÃO CONFIRMADO: variam muito)
const MEDIDAS = [[/^(kg|quilo)s?$/, 1000], [/^(g|gr|grama)s?$/, 1], [/^ml$/, 1], [/^(l|litro)s?$/, 1000], [/^colher(es)?$/, 15], [/^concha(s)?$/, 140], [/^escumadeira(s)?$/, 90], [/^xicara(s)?$/, 160], [/^copo(s)?$/, 250], [/^prato(s)?$/, 300], [/^fatia(s)?$/, 25], [/^pedaco(s)?$/, 60], [/^lata(s)?$/, 350], [/^dose(s)?$/, 30], [/^scoop(s)?$/, 30], [/^pote(s)?$/, 170], [/^porcao|porcoes$/, null], [/^(unidade|un|und)s?$/, "un"], [/^(file|bife|posta)s?$/, 120], [/^punhado(s)?$/, 30]];

  return parts.map(raw => {

    let m = s.match(/^(\d+(?:[.,]\d+)?|meia|meio|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\s*(.*)$/);
    if (m) { qtd = NUMW[m[1]] ?? num(m[1]); s = m[2]; }
    else { const m2 = s.match(/(.*?)\s*(\d+(?:[.,]\d+)?)\s*(g|gr|gramas|ml|kg)\b(.*)/); if (m2) { qtd = num(m2[2]); unit = m2[3]; s = (m2[1] + " " + m2[4]).trim(); } }
    if (!unit) { const w = s.split(/\s+/)[0]; if (MEDIDAS.some(([re]) => re.test(w))) { unit = w; s = s.slice(w.length).trim(); } }
    s = s.replace(/^(de|do|da)\s+/, "").replace(/\b(sopa|cha)\b/g, x => (unit && /colher/.test(unit) ? (unit = "colher " + x, "") : x)).trim();
    let qs = tokens(s).map(w => SYN[w] || w).join(" ");
    const qt = tokens(qs);
    const res = qt.length ? allFoods().map(f => ({ f, sc: matchScore(qt, f) })).filter(x => x.sc >= 0.55).sort((a, b) => b.sc - a.sc || a.f.nome.length - b.f.nome.length) : [];

    let modo = "g", q;
    const med = unit && MEDIDAS.find(([re]) => re.test(unit.split(" ")[0]));
    let g = null;
    if (unit) {

      if (g === null && f.tipo === "porcao") { modo = "porcao"; q = qtd || 1; }

  });
}
function addTexto() {

function aiMealPrompt(desc, foto) {
  return `Você estima a nutrição de refeições para um app brasileiro de dieta. ${foto ? "Analise a foto do prato" + (desc ? " e esta descrição do usuário: " + desc : "") : "Refeição descrita pelo usuário: " + desc}.
Liste cada alimento separado com a quantidade estimada em gramas (ou ml) e os valores TOTAIS dessa quantidade, usando a tabela TACO quando possível.
Responda apenas JSON neste formato: {"itens":[{"nome":"Arroz branco cozido","gramas":150,"kcal":192,"p":3.8,"c":42.2,"g":0.3,"f":2.4}],"obs":"uma frase curta sobre incertezas"}
Campos: p = proteína g, c = carboidrato g, g = gordura g, f = fibra g. Nomes em português.`;
}
function aiToParsed(res) {
  const itens = (res && res.itens || []).filter(x => x && x.nome);
  return itens.map(x => {
    const gr = num(x.gramas), t = { kcal: num(x.kcal), p: num(x.p), c: num(x.c), g: num(x.g), f: num(x.f) };
    const base = gr > 0 ? Object.fromEntries(Object.entries(t).map(([k, v]) => [k, v * 100 / gr])) : t;
    const e = { id: uid(), key: null, nome: String(x.nome).slice(0, 80), qtd: gr > 0 ? gr : 1, modo: gr > 0 ? "g" : "porcao", base, src: "IA" };
    const f = Object.assign({ key: null, nome: e.nome, cat: "", src: "IA", tipo: gr > 0 ? "100g" : "porcao" }, base);
    return { raw: "estimado pela IA", ok: true, f, e, estim: true };
  });
}
function aiErrMsg(e) {
  const c = e && e.code;
  if (c === "not_granted") return "Você não autorizou o uso do Claude. Use o cálculo sem IA.";
  if (c === "rate_limited" || c === "queue_overflow") return "Muitos pedidos seguidos. Espere um minuto e tente de novo.";
  if (c === "invalid_json" || c === "empty_completion") return "A IA respondeu num formato que não deu para ler. Tente de novo ou escreva os itens com gramas.";
  if (c === "image_rejected") return "Essa imagem não foi aceita. Tente uma foto JPG ou PNG menor.";
  if (c === "cancelled") return "";
  if (c === "bad_key") return "A chave da API não foi aceita. Confira em Perfil > IA.";
  if (c === "no_credit") return "A conta da API está sem crédito. Coloque crédito em console.anthropic.com ou use outra IA.";
  if (c === "network") return "A IA não respondeu (internet fraca ou Gemini lotado). Tente de novo em instantes.";
  if (c === "refused") return "A IA recusou esse pedido. Tente descrever de outro jeito.";
  return "A IA não respondeu agora. Use o cálculo sem IA ou tente mais tarde.";
}

function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", 0.85);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

/* Semana pela rotação (v69): se o perfil não tem dias escolhidos (p.semana vazio) mas tem rotinas (ex.: vindas do Painel/Hevy),
   Seg a Sex giram as rotinas na ordem, continuando do último treino feito; a rotina "bônus/opcional" vai ao sábado; domingo folga.
   Quem escolheu os dias à mão (p.semana com algum dia) continua mandando. */
function semanaRot(p, ws, feitos, hoje) {
  const rs = (p.rotinas || []).filter(r => r && r.id && r.nome && !r.taf); // rotinas TAF (flag taf) nunca entram na rotação push/pull/perna
  const base = rs.filter(r => !/b[ôo]nus|opcional/i.test(r.nome)), bon = rs.find(r => /b[ôo]nus|opcional/i.test(r.nome));
  const out = {}; if (!base.length) return out;
  const isLeg = r => /^\s*(legs?|pernas?)\b/i.test(r.nome), leg = base.find(isLeg), nonLeg = base.filter(r => !isLeg(r));
  /* v73 (13/11/2026, Lucas): uma perna a cada par push+pull (PUSH A, PULL A, LEGS, PUSH B, PULL B, LEGS), nunca 4 treinos seguidos sem perna.
     Sem rotina de perna, ou sem outra rotina, o ciclo é a lista como veio. */
  const rot = leg && nonLeg.length ? nonLeg.flatMap((r, i) => i % 2 || i === nonLeg.length - 1 ? [r, leg] : [r]) : base;
  const norm = s => String(s || "").trim().toLowerCase();
  const casa = (w, r) => (w.rotinaId && r.id === w.rotinaId) || (norm(w.nome) && norm(w.nome).startsWith(norm(r.nome)));
  let last = -1;
  for (let n = 0; n < ws.length && last < 0; n++) {
    const w = ws[n];
    if (leg && casa(w, leg) && rot !== base) {
      /* perna aparece mais de uma vez no ciclo: a posição vem do último treino que NÃO foi perna (se a perna é a seguinte a ele no ciclo, ocupa o lugar; senão volta ao ponto dele) */
      const pv = ws.slice(n + 1).find(x => !casa(x, leg) && nonLeg.some(r => casa(x, r)));
      const pi = pv ? rot.findIndex(r => r !== leg && casa(pv, r)) : -1;
      last = pi < 0 ? rot.indexOf(leg) : rot[pi + 1] === leg ? pi + 1 : pi; break;
    }
    const i = rot.findIndex(r => casa(w, r)); if (i >= 0) { last = i; break; }
  }
  let k = last + 1; const dw0 = dowOf(hoje);
  for (const dw of [1, 2, 3, 4, 5]) {
    const passado = ((dw + 6) % 7) < ((dw0 + 6) % 7);
    if (passado) continue;
    if (dw === dw0 && feitos) continue;
    out[dw] = rot[k % rot.length].id; k++;
  }
  if (bon) out[6] = bon.id;
  return out;
}

      try {
        const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        const d = c.toDataURL("image/jpeg", 0.72), hj = TODAY();
        await fotoPut({ id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), w: "prog:" + hj, t: Date.now(), d });

function medGraficos(per = 90) {
  const m = medGet(), blocos = m.campos.map(c => {

    let pts = todos.filter(x => x.x >= addDays(TODAY(), -(per - 1))); if (pts.length < 2) pts = todos.slice(-2); // poucos registros no período: mostra os 2 últimos
    if (pts.length < 2) return ""; const d = pts[pts.length - 1].y - pts[0].y;
    return `<div style="margin-top:8px"><div class="row between"><b class="small">${esc(c.nome)}</b><span class="xs muted">${fmt1(pts[0].y)} → ${fmt1(pts[pts.length - 1].y)} cm (${d > 0 ? "+" : ""}${fmt1(d)})</span></div>${lineChart(pts, { unit: "cm", color: "--accent", h: 130, label: "Evolução de " + c.nome + " nos últimos " + per + " dias" })}</div>`;
  }).join("");
  return blocos ? `<details class="acc"><summary class="small ink2">Ver gráficos das medidas</summary>${blocos}</details>` : "";
}

// Escolha da cena do momento (substitui a anterior): gatilhos por hora, dia, treino, comida, água, peso, sequência e nota.
// Variações: em situações parecidas, o dia do mês escolhe entre 2 ou 3 cenas, para não ficar repetitivo.
let FR_ULT = { slot: -1, salt: 0, cena: "" };
const FR_SLOT_MS = 3600000; // a cena é reavaliada a cada 1 hora
function frCenaApp0(c, dia) {
  if (FR_REACAO && Date.now() < FR_REACAO.ate) return FR_REACAO.cena;
  const P = L => L[dia % L.length]; // escolhe dentro do grupo que combina com o momento
  const h = c.hr, dow = c.dow;
  if (c.pensando) return "pensando";
  if (c.ativo) return "treinando";
  if (c.correndo) return P(["fone", "corrida"]);
  // treinou hoje: comemoração. fogo só com sequência; água ok soma "hidratado"
  if (c.treinou) {
    const L = ["forte", "aplauso", "shake", "danca"];
    if ((c.seq || 0) >= 3) L.push("fogo");
    if (c.aguaOk) L.push("hidratado");
    if (h >= 21) return P(["forte", "aplauso", "noite", "meditando"]);
    return P(L);
  }
  if (c.passou) return P(["rei", "alfa"]);
  if (c.estourou) return "pizza";
  if (c.nivel === "Pintinho" && c.temComida && h >= 14 && h < 22 && dia % 3 === 0) return "pintinho";
  if (h < 5) return P(["geladeira", "bocejo", "soneca"]);
  if (h < 9) { const L = ["manha", "cafeina", "bocejo", "alongando"]; if (c.aguaOk) L.push("hidratado"); return P(L); }
  if (dow === 0 && h < 18) return P(["domingo", "meditando", "sofa", "soneca", "alongando"]);
  if (dow === 6 && h >= 11 && h < 18) return P(["sabado", "fone", "cafeina", "alongando"]);
  if (h < 11) return P(["manha", "cafeina", "alongando", "fone"]);
  if (h < 14) {
    if (c.temComida) return P(["almoco", "almoco", "hidratado", "alongando"].filter(x => x !== "hidratado" || c.aguaOk));
    return P(["relogio", "almoco", "geladeira"]);
  }
  if (h < 18) {
    const L = ["soneca", "cafeina", "alongando", "fone"];
    if (c.aguaOk) L.push("hidratado");
    if (!c.temComida) L.push("relogio");
    if (c.treinavel === false) L.push("alongando", "meditando");
    return P(L);
  }
  if (h < 22) {
    if (c.treinavel && !c.mexeu) return P(["sofa", "noite", "relogio"]);
    return P(["noite", "meditando", "fone", "sofa"]);
  }
  return P(["noite", "bocejo", "soneca", "meditando"]);
}
// nunca repete a cena anterior quando há outra opção (a corrida pós-exercício continua mandando)
function frCenaApp(c) {
  const slot = Math.floor(Date.now() / FR_SLOT_MS);
  if (FR_ULT.slot === slot) { const r = frCenaApp0(c, FR_ULT.salt); FR_ULT.cena = r; return r; }
  const ant = FR_ULT.cena; let salt = slot, r = frCenaApp0(c, salt);
  for (let k = 1; r === ant && k <= 6; k++) { salt = slot + k; r = frCenaApp0(c, salt); }
  FR_ULT = { slot, salt, cena: r }; return r;
}

const MEAL_PESO = { cafe: .25, almoco: .35, lanche: .10, jantar: .25, ceia: .05 };

  const est = i => { const d = at[i] - obj[i]; return Math.abs(d) <= 5 ? ["no alvo", "var(--good,var(--ok,#2B7A57))"] : d > 0 ? ["acima da meta", "var(--warn,#8A5A00)"] : ["abaixo da meta", "var(--bad,#C0392B)"]; };
  const lin = ([n, i, c]) => { const [e, ec] = est(i); return `<div style="margin-top:12px"><div class="row between"><b>${n}</b>${tem ? `<span class="small" style="font-weight:700;color:${ec}">${e}</span>` : `<span class="small muted">sem comida ainda</span>`}</div>
    <div class="bar" style="position:relative;margin-top:4px"><i style="width:${clamp(at[i], 0, 100)}%;background:var(${c})"></i><span style="position:absolute;top:-3px;bottom:-3px;left:${clamp(obj[i], 0, 100)}%;width:3px;background:var(--ink)"></span></div>
    <div class="small" style="margin-top:3px">${tem ? `Você: <b>${Math.round(at[i])}%</b> (${fmt(gr[i][0])} g) · ` : ""}Meta: <b>${Math.round(obj[i])}%</b> (${fmt(gr[i][1])} g no dia)</div></div>`; };

// ---- 1. Meus dados ----
function ixHa(t, agora) {
  const s = Math.max(0, ((agora == null ? Date.now() : agora) - t) / 1000);
  if (s < 60) return "agora há pouco";
  if (s < 3600) return "há " + Math.floor(s / 60) + " min";
  if (s < 86400) return "há " + Math.floor(s / 3600) + " h";
  const d = Math.floor(s / 86400); return "há " + d + (d === 1 ? " dia" : " dias");
}
function ixDadosEstado(o) {
  const n = o.nuvem || {};
  if (!o.temDados) return { nivel: "ok", msg: "Ainda não há nada para guardar." };
  if (n.user) {
    if (n.err) return { nivel: "ruim", msg: "A nuvem falhou na última tentativa. Seus dados continuam neste aparelho; toque em Guardar na nuvem para tentar de novo." };
    return { nivel: "ok", msg: "Guardado na nuvem" + (n.ultOk ? " · " + ixHa(n.ultOk) : "") + "." };
  }
  if (!o.ultBackup) return { nivel: "aviso", msg: "Você ainda não fez nenhuma cópia. Se o navegador limpar os dados, tudo some." };
  const dias = Math.round((new Date(o.hoje + "T12:00:00") - new Date(o.ultBackup + "T12:00:00")) / 864e5);
  if (dias >= 7) return { nivel: "aviso", msg: "Sua última cópia foi há " + dias + " dias. Vale baixar uma nova." };
  return { nivel: "ok", msg: "Última cópia: " + (dias <= 0 ? "hoje" : "há " + dias + (dias === 1 ? " dia" : " dias")) + "." };
}
// ---- 2. Estagnação ----
// Meta para destravar: +1 repetição na mesma carga (ou +inc kg se já está no topo das repetições); semana leve = 60% da carga
function ixMetaCarga(o) {
  const kg = num(o.kg), top = num(o.top) || 12, min = num(o.min) || 8, inc = num(o.inc) || 2, mr = num(o.maxReps) || min;
  const sug = mr < top ? { kg, reps: mr + 1 } : { kg: Math.round((kg + inc) * 100) / 100, reps: min };
  const leve = { kg: Math.max(2.5, Math.round(kg * 0.6 / 2.5) * 2.5), reps: mr };
  return { sug, leve };
}
// a meta vale até o próximo treino que traga o exercício (depois volta ao normal)
function ixMetaAtiva(m, ws, eid) {
  if (!m || !(m.em > 0)) return false;
  return !(ws || []).some(w => !w.ignorar && w.inicio > m.em && (w.ex || []).some(x => x.eid === eid && (x.series || []).some(s => s.ok)));
}
// Cargas travadas: os n mais relevantes (maior carga primeiro) e quantos ficam de fora
function ixCargasTop(lista, n) {
  const l = (lista || []).slice().sort((a, b) => (b.kg - a.kg) || String(a.nome).localeCompare(String(b.nome)));
  return { total: l.length, top: l.slice(0, n), resto: Math.max(0, l.length - n) };
}
const ixE1 = (kg, reps) => kg > 0 && reps > 0 ? kg * (1 + reps / 30) : 0;
function ixEstagnacaoCarga(ws, eid) {
  const sess = [];
  for (const w of ws) {
    if (w.ignorar) continue;
    const ex = (w.ex || []).find(x => x.eid === eid); if (!ex || (ex.tipo && ex.tipo !== "carga")) continue;
    const ok = (ex.series || []).filter(s => s.ok && s.tipo !== "aq" && num(s.kg) > 0); if (!ok.length) continue;
    sess.push({ nome: ex.nome, kg: Math.max(...ok.map(s => num(s.kg))), e1: Math.max(...ok.map(s => ixE1(num(s.kg), num(s.reps)))) });
    if (sess.length === 3) break;
  }
  if (sess.length < 3) return null;
  const [novo, meio, velho] = sess;
  if (novo.kg > velho.kg || meio.kg > velho.kg || novo.e1 > velho.e1 * 1.02 || meio.e1 > velho.e1 * 1.02) return null;
  return { eid, nome: novo.nome, kg: novo.kg, n: 3 };
}
function ixEstagnacaoPeso(pesos, hoje, objetivo, metaPeso) {
  if (objetivo === "manter") return null;
  const j = (pesos || []).filter(p => p.data >= addDays(hoje, -21) && p.data <= hoje && num(p.kg) > 0); if (j.length < 2) return null;
  const span = Math.round((new Date(j[j.length - 1].data + "T12:00:00") - new Date(j[0].data + "T12:00:00")) / 864e5); if (span < 14) return null;
  const kgs = j.map(p => num(p.kg)); if (Math.max(...kgs) - Math.min(...kgs) >= 0.3) return null;

// ---- 3. Resumo semanal ----
function ixSemanaRef(hoje) {

  if (dow === 1 || dow === 2) { const fim = addDays(hoje, -dow); return { ini: addDays(fim, -6), fim, passada: true }; }

function ixResumoSemana(c) {

  const dPeso = c.pesoIni != null && c.pesoFim != null ? r1(c.pesoFim - c.pesoIni) : null, treinos = c.treinos || 0, meta = num(c.metaKcal);

  else if (dPeso != null && ((c.objetivo === "perder" && dPeso < 0) || (c.objetivo === "ganhar" && dPeso > 0))) conquista = "O peso andou na direção certa (" + (dPeso > 0 ? "+" : "") + String(dPeso).replace(".", ",") + " kg).";
  else if (diasReg >= 5) conquista = diasReg + " dias registrados.";
  else if (treinos > 0 || diasReg > 0) conquista = "Você manteve o app vivo, e isso conta.";
  else conquista = "Semana nova pela frente: o primeiro registro é o mais difícil.";
  let ajuste;
  if (diasReg < 4) ajuste = "Tente registrar pelo menos duas refeições por dia na próxima semana.";
  else if (meta && kcalMedia > meta * 1.1) ajuste = "A média ficou " + Math.round(kcalMedia - meta) + " kcal acima da meta; olhe os dias mais pesados e escolha um para ajustar.";
  else if (meta && kcalMedia < meta * 0.8) ajuste = "A média ficou bem abaixo da meta; comer pouco demais atrapalha treino e sono.";
  else if (treinos === 0) ajuste = "Que tal marcar um treino cedo na semana que vem?";

  return { diasReg, kcalMedia, treinos, dPeso, conquista, ajuste, curto };
